name: knip

# Dead-code + unused-export detection. Catches exports/files/dependencies
# that no consumer references — TS strict mode and oxlint don't surface
# this. **Merge-blocking** as of PAI-137 — the baseline was cleared in
# PAI-136. Any new finding fails the job. To intentionally allow a new
# unused export / dep, update knip.json's ignore lists with a comment
# explaining why rather than re-adding --no-exit-code.

on:
  pull_request:
    # `ready_for_review` lets a draft→ready flip re-fire the workflow.
    # Without it, GH only re-fires on push events to the branch; the
    # if-guard (PAI-146) then sees draft=true and skips, leaving CI
    # marked "skipping" indefinitely after the flip.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# Minimum needed for actions/checkout. Explicit per PAI-135.
permissions:
  contents: read

jobs:
  knip:
    # Skip on draft PRs so CI minutes aren't burned on in-progress work.
    # `pull_request.draft` is unset on push events, so pushes to main proceed.
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Knip — dead code + unused exports
        run: pnpm knip
