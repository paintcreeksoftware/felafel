name: knip

# Dead-code + unused-export detection. Catches exports/files/dependencies
# that no consumer references — TS strict mode and oxlint don't surface
# this. Runs as **advisory** (--no-exit-code in the script) so PRs aren't
# blocked while we triage the initial backlog (PAI-117). Promote to
# merge-blocking by dropping --no-exit-code from the script after the
# baseline is clean.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  knip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Knip — dead code + unused exports
        run: pnpm knip
