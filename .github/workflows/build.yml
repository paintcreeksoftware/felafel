name: build

on:
  pull_request:
    # `ready_for_review` lets a draft→ready flip re-fire the workflow.
    # Without it, GH only re-fires on push events to the branch; the
    # if-guard (PAI-146) then sees draft=true and skips, leaving CI
    # marked "skipping" indefinitely after the flip.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# Minimum needed for actions/checkout. Explicit per PAI-135 / CodeQL
# actions/missing-workflow-permissions.
permissions:
  contents: read

jobs:
  build:
    # Skip on draft PRs so CI minutes aren't burned on in-progress work.
    # `pull_request.draft` is unset on `push` events (then comparison is
    # `undefined != true` → true), so pushes to main still run.
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        # Turbo handles ordering: orchestrator builds before desktop because of
        # the cross-package dep declared in turbo.json.
        run: pnpm build
