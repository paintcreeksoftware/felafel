name: PR drift snapshot comment

# When a PR flips to ready (or its body is edited), lift the
# `<!-- claude-drift-snapshot:* -->` content stamped by
# `pnpm pr:ready` (PAI-165) and post (or update) a PR comment with a
# fixed header marker so subsequent edits update the same comment
# in-place. The PATCH path no-ops if the body is unchanged, so this
# workflow does not feedback-loop on its own edits.

on:
  pull_request:
    types: [ready_for_review, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  post-drift-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Lift and post/update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          body="$PR_BODY"

          drift=$(awk '
            /<!-- claude-drift-snapshot:start -->/{flag=1; next}
            /<!-- claude-drift-snapshot:end -->/{flag=0}
            flag
          ' <<<"$body")

          if [ -z "$(printf '%s' "$drift" | tr -d '[:space:]')" ]; then
            echo "::warning::claude-drift-snapshot is empty — PAI-165 hook did not run before ready flip"
            exit 0
          fi

          marker='<!-- claude-drift-comment -->'
          comment_body=$(printf '%s\n## Memory drift snapshot (auto-stamped from `pnpm pr:ready`)\n\n%s' "$marker" "$drift")

          existing_id=$(gh api "/repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n1)

          if [ -n "$existing_id" ]; then
            existing_body=$(gh api "/repos/$REPO/issues/comments/$existing_id" --jq .body)
            if [ "$existing_body" = "$comment_body" ]; then
              echo 'No change; skipping update.'
              exit 0
            fi
            gh api -X PATCH "/repos/$REPO/issues/comments/$existing_id" \
              -f body="$comment_body" > /dev/null
            echo "Updated drift comment on PR #$PR_NUMBER"
          else
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$comment_body"
            echo "Posted drift comment on PR #$PR_NUMBER"
          fi
