name: e2e

on:
  pull_request:
  push:
    branches: [main]

# Minimum needed for actions/checkout + actions/upload-artifact (artifact
# API works with contents: read). Explicit per PAI-135.
permissions:
  contents: read

jobs:
  e2e:
    # Skip on draft PRs so CI minutes aren't burned on in-progress work.
    # `pull_request.draft` is unset on push events, so pushes to main proceed.
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    # The official Playwright image bakes in browsers + every required system
    # library + xvfb. Without it the previous workflow spent ~16 of its ~17
    # minutes on `apt-get install xvfb` (~6 min) and
    # `playwright install --with-deps chromium` (~10 min). The container
    # collapses both to a one-time image pull. Pin the tag to the resolved
    # @playwright/test version in pnpm-lock.yaml — bump together when
    # upgrading Playwright in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-jammy
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the Electron app
        run: pnpm build

      - name: Run E2E tests under xvfb
        run: xvfb-run --auto-servernum pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/desktop/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/desktop/test-results/
          retention-days: 14
          if-no-files-found: ignore
