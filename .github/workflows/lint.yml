name: lint

on:
  pull_request:
  push:
    branches: [main]

# Minimum needed for actions/checkout. Explicit per PAI-135.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (oxlint)
        run: pnpm lint

      - name: Type-check
        run: pnpm check-types

      - name: Lint markdown
        run: pnpm lint:md

      - name: Lint shell scripts
        run: pnpm lint:sh

      # Fails if the Drizzle schema in @felafel/contracts has diverged from
      # the committed migrations under packages/db/migrations/. Catches the
      # "edited schema, forgot to run db:generate" failure mode.
      - name: Drizzle schema-drift check
        run: pnpm db:check

      # Verifies every `@felafel/<pkg>/<sub-path>` import has a matching
      # entry in the target package's package.json#exports. Catches the
      # tsconfig-paths-vs-package-exports drift that broke PAI-139 #57.
      - name: Export-coverage check
        run: pnpm lint:exports

      # Lints root-level .mjs files (commitlint.config.mjs + scripts/*.mjs)
      # that fall outside every workspace's per-package oxlint scope.
      # Retired when PAI-141's eslint cutover folds this in.
      - name: Lint root-level scripts
        run: pnpm lint:scripts

      # Prints any source file over the 300-line cap (PAI-140). Warn-mode
      # today — the script exits 0 even when offenders are present, so
      # this step is informational. Flipped to error-mode in a follow-up
      # PAI-140 PR once the in-scope offenders are refactored.
      - name: Source-file LOC cap (warn)
        run: pnpm lint:loc
