name: lint

on:
  pull_request:
    # `ready_for_review` lets a draft→ready flip re-fire the workflow.
    # Without it, GH only re-fires on push events to the branch; the
    # if-guard (PAI-146) then sees draft=true and skips, leaving CI
    # marked "skipping" indefinitely after the flip.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# Minimum needed for actions/checkout. Explicit per PAI-135.
permissions:
  contents: read

jobs:
  lint:
    # Skip on draft PRs so CI minutes aren't burned on in-progress work.
    # `pull_request.draft` is unset on push events, so pushes to main proceed.
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm lint` runs `turbo run lint` (parallel per-package ESLint)
      # followed by `pnpm lint:root` for the non-workspace files
      # (commitlint.config.mjs + eslint/ + scripts/).
      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm check-types

      - name: Lint markdown
        run: pnpm lint:md

      - name: Lint shell scripts
        run: pnpm lint:sh

      # Fails if the Drizzle schema in @felafel/contracts has diverged from
      # the committed migrations under packages/db/migrations/. Catches the
      # "edited schema, forgot to run db:generate" failure mode.
      - name: Drizzle schema-drift check
        run: pnpm db:check

      # Verifies every `@felafel/<pkg>/<sub-path>` import has a matching
      # entry in the target package's package.json#exports. Catches the
      # tsconfig-paths-vs-package-exports drift that broke PAI-139 #57.
      - name: Export-coverage check
        run: pnpm lint:exports
