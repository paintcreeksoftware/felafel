name: PR cost summary

# When a PR flips to ready (or its body is edited), lift the
# `<!-- claude-cost-block:* -->` content stamped by `pnpm pr:ready`
# (PAI-165) and surface it as a "## Cost summary" section near the top
# of the PR description. Re-runs on `edited` are guarded by a no-op
# compare so the workflow does not feedback-loop on its own edits.

on:
  pull_request:
    types: [ready_for_review, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  stamp-cost-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Lift and splice
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          body="$PR_BODY"

          cost=$(awk '
            /<!-- claude-cost-block:start -->/{flag=1; next}
            /<!-- claude-cost-block:end -->/{flag=0}
            flag
          ' <<<"$body")

          if [ -z "$(printf '%s' "$cost" | tr -d '[:space:]')" ]; then
            echo "::warning::claude-cost-block is empty — PAI-165 hook did not run before ready flip"
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body ':warning: `claude-cost-block` marker zone is empty. Flip to ready bypassed `pnpm pr:ready` (PAI-165) — CI cannot lift cost data. Re-run `pnpm pr:ready '"$PR_NUMBER"'` to stamp.'
            exit 0
          fi

          summary=$(printf '<!-- cost-summary:start -->\n## Cost summary\n\n%s\n<!-- cost-summary:end -->' "$cost")

          if grep -q '<!-- cost-summary:start -->' <<<"$body"; then
            new_body=$(awk -v block="$summary" '
              /<!-- cost-summary:start -->/{print block; flag=1; next}
              /<!-- cost-summary:end -->/{flag=0; next}
              !flag
            ' <<<"$body")
          else
            new_body=$(printf '%s\n\n%s' "$summary" "$body")
          fi

          if [ "$new_body" = "$body" ]; then
            echo 'No change; skipping edit.'
            exit 0
          fi

          gh pr edit "$PR_NUMBER" --repo "$REPO" --body "$new_body"
          echo "Stamped cost summary onto PR #$PR_NUMBER"
