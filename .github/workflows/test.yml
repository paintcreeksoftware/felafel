name: test

on:
  pull_request:
    # `ready_for_review` lets a draft→ready flip re-fire the workflow.
    # Without it, GH only re-fires on push events to the branch; the
    # if-guard (PAI-146) then sees draft=true and skips, leaving CI
    # marked "skipping" indefinitely after the flip.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# Minimum needed for actions/checkout + actions/upload-artifact (artifact
# API works with contents: read, no write needed). Explicit per PAI-135.
permissions:
  contents: read

jobs:
  test:
    # Skip on draft PRs so CI minutes aren't burned on in-progress work.
    # `pull_request.draft` is unset on push events, so pushes to main proceed.
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build orchestrator bundle
        # Integration tests spawn apps/orchestrator/dist/index.mjs.
        run: pnpm --filter @felafel/orchestrator build

      - name: Orchestrator unit tests
        run: pnpm --filter @felafel/orchestrator test

      - name: Desktop unit tests with coverage
        run: pnpm --filter @felafel/desktop test --coverage

      - name: Integration tests
        run: pnpm test:integration

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: apps/desktop/coverage/
          retention-days: 14
          if-no-files-found: ignore
