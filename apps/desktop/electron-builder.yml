# electron-builder config. Operates on `out/` after electron-vite has bundled
# the source. Produces platform installers in `release/`.
#
# `extraResources` ships the orchestrator service bundle alongside the app so
# the main process can spawn it as a sidecar at runtime via Electron's
# bundled Node (ELECTRON_RUN_AS_NODE). The orchestrator's drizzle migrations
# folder ships as a SIBLING of orchestrator/ (not nested under it) because
# the bundled @felafel/db code resolves migrationsFolder via
# `import.meta.dirname` then walks `..`: at runtime that's
# `resources/orchestrator/` → `resources/`, so migrations land at
# `resources/migrations/`. The Docker image does the parallel COPY in
# its runtime stage.
appId: software.paintcreek.felafel
productName: Felafel
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  - "!**/.vscode/*"
  - "!**/*.{ts,tsx,map}"
  - "!**/.eslintrc*"
extraResources:
  - from: ../orchestrator/dist/
    to: orchestrator/
  - from: ../orchestrator/migrations/
    to: migrations/
mac:
  target:
    - dmg
  category: public.app-category.productivity
linux:
  target:
    - AppImage
  category: Utility
  # Without this, electron-builder defaults `executableName` to
  # `sanitizeFileName(package.json#name).toLowerCase()`, which for our
  # scoped name `@felafel/desktop` becomes `@felafeldesktop`. That string
  # then ends up as the .desktop file's `Icon=` field, the .desktop
  # filename itself, and the install path under `hicolor/<size>/apps/`.
  # GNOME's icon-theme lookup can't resolve `@felafeldesktop` (the `@` is
  # not a valid identifier), so the app falls back to a generic icon.
  # electron-builder has a special case for scoped names in
  # `linuxPackageName` (appInfo.js:121) but it isn't reused for
  # `executableName` (linuxPackager.js:16). Explicit override is the fix.
  executableName: felafel
win:
  target:
    - nsis
