# electron-builder config. Operates on `out/` after electron-vite has bundled
# the source. Produces platform installers in `release/`.
#
# `extraResources` ships the PocketBase Go binary alongside the app so the
# main process can spawn it as a sidecar at runtime.
#
# `asarUnpack` keeps those binaries as real files on disk. Electron normally
# packs everything into a `.asar` archive for fast loading, but you can't
# `exec()` files inside an archive — so the PocketBase binary has to be
# unpacked.
appId: software.paintcreek.felafel
productName: Felafel
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  - "!**/.vscode/*"
  - "!**/*.{ts,tsx,map}"
  - "!**/.eslintrc*"
extraResources:
  - from: resources/pocketbase/${platform}-${arch}/
    to: pocketbase/
  - from: ../orchestrator/dist/
    to: orchestrator/
asarUnpack:
  - resources/pocketbase/**
mac:
  target:
    - dmg
  category: public.app-category.productivity
linux:
  target:
    - AppImage
  category: Utility
win:
  target:
    - nsis
