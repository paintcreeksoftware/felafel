[felafel]
# Fedora toolbox matches the Bluefin DX host: same package manager, same
# fontconfig/themes, same XDG runtime, same PipeWire — Electron renders
# directly on the host display with no friction.
image=registry.fedoraproject.org/fedora-toolbox:41
pull=true
init=false
nvidia=false
# Node.js + npm for the JS toolchain, plus the GTK / X11 / NSS / audio /
# DRM stack Electron 41 links against. nss pulls in nspr automatically.
additional_packages="git curl unzip ca-certificates nodejs npm nss atk at-spi2-atk cups-libs libdrm libxkbcommon libXcomposite libXdamage libXfixes libXrandr mesa-libgbm pango cairo alsa-lib gtk3 ShellCheck xorg-x11-server-Xvfb"
# Install any pnpm via npm. The actual pinned version lives in
# package.json's `packageManager` field — pnpm self-bootstraps to it on
# first use thanks to `manage-package-manager-versions=true` in .npmrc.
init_hooks="sudo npm install -g pnpm"
